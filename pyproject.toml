[project]
name = "homeops-ai"
version = "0.5.0"
description = "Evidence-backed HomeOps knowledge platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50,<51",
    "markdown-it-py>=4,<5",
    "mcp>=1.28.1,<2",
    "PyJWT[crypto]>=2.10,<3",
    "pycozo[embedded]==0.7.6",
    "ruamel-yaml>=0.18,<0.19",
    "starlette>=0.49,<2",
    "uvicorn>=0.49,<0.50",
]

[project.scripts]
homeops-ai = "homeops_ai.cli:main"
homeops-ai-mcp = "homeops_ai.mcp_server:main"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
